<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyClaw - 配置编辑器</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-hover: #273548;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --danger: #f87171;
  --success: #4ade80;
  --warning: #fbbf24;
  --radius: 8px;
  --radius-sm: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
nav .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
nav .logo span { color: var(--accent); }
nav .links { display: flex; gap: 8px; }
nav .links a {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 0.9rem;
  transition: all 0.15s;
}
nav .links a:hover, nav .links a.active { color: var(--text); background: var(--card-hover); }
nav .version { margin-left: auto; font-size: 0.8rem; color: var(--muted); }

.container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
.page-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
.page-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  position: sticky;
  top: 72px;
  z-index: 50;
  padding: 12px 0;
  background: var(--bg);
}
.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: #0f172a; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--card-hover); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: rgba(248,113,113,0.1); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 0.875rem;
  z-index: 1000;
  animation: slideIn 0.3s ease;
  max-width: 400px;
}
.toast-success { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
.toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.section-header:hover { background: var(--card-hover); }
.section-header h3 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-header .icon { font-size: 1.1rem; }
.section-header .toggle-icon { transition: transform 0.2s; color: var(--muted); }
.section.collapsed .section-body { display: none; }
.section.collapsed .toggle-icon { transform: rotate(-90deg); }
.section-body { padding: 0 20px 20px; }

.form-group { margin-bottom: 16px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-label strong { color: var(--text); font-weight: 500; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

input[type="text"],
input[type="number"],
select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.875rem;
  font-family: inherit;
  transition: border-color 0.15s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
input::placeholder { color: #475569; }

.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  display: inline-block;
  flex-shrink: 0;
}
.toggle-switch input { display: none; }
.toggle-switch label {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch label::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle-switch input:checked + label { background: var(--accent); }
.toggle-switch input:checked + label::after { transform: translateX(20px); }

.source-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  overflow: hidden;
}
.source-card-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.source-card-header:hover { background: rgba(255,255,255,0.03); }
.source-card-header .source-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
.source-card-header .source-priority {
  font-size: 0.75rem;
  color: var(--muted);
  background: var(--card);
  padding: 2px 8px;
  border-radius: 10px;
}
.source-card.collapsed .source-body { display: none; }
.source-card .source-body { padding: 16px; border-top: 1px solid var(--border); }

.status-badge {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 10px;
  font-weight: 500;
}
.status-badge.on { background: rgba(74,222,128,0.15); color: var(--success); }
.status-badge.off { background: rgba(248,113,113,0.15); color: var(--danger); }
</style>
</head>
<body>
<nav>
  <div class="logo">✈️ Fly<span>Claw</span></div>
  <div class="links">
    <a href="/">首页</a>
    <a href="/guide">教程</a>
    <a href="/config" class="active">配置</a>
    <a href="/query">查询</a>
  </div>
  <div class="version">v{{ version }}</div>
</nav>

<div class="container">
  <h1 class="page-title">配置编辑器</h1>
  <p class="page-subtitle">管理 FlyClaw 数据源、查询参数与输出偏好设置</p>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button>
    <button class="btn btn-secondary" onclick="loadConfig()">🔄 重新加载</button>
    <button class="btn btn-danger btn-sm" onclick="resetDefaults()">↩ 恢复默认值</button>
  </div>

  <div id="config-content">
    <div style="text-align:center;padding:60px;color:var(--muted);">正在加载配置...</div>
  </div>
</div>

<script>
let currentConfig = null;

async function loadConfig() {
  try {
    const resp = await fetch('/api/config');
    const data = await resp.json();
    if (data.status === 'ok') {
      currentConfig = data.config;
      renderConfig(data.config);
    }
  } catch (e) {
    showToast('加载配置失败: ' + e.message, 'error');
  }
}

function renderConfig(config) {
  const container = document.getElementById('config-content');
  let html = '';

  // Sources
  html += renderSection('📡 数据源', 'sources', () => {
    let srcHtml = '';
    const sources = config.sources || {};
    for (const [key, src] of Object.entries(sources)) {
      srcHtml += renderSourceCard(key, src, config);
    }
    return srcHtml;
  }, false);

  // Cache
  html += renderSection('💾 缓存设置', 'cache', () => {
    const c = config.cache || {};
    return `
      <div class="form-row">
        ${renderField('text', '缓存目录', `cache_${Math.random()}`, c.dir || 'cache', 'cache.dir')}
        ${renderField('number', '机场数据更新周期（天）', `cache_upd_${Math.random()}`, c.airport_update_days ?? 99999, 'cache.airport_update_days')}
      </div>
      ${renderField('text', '更新 URL', `cache_url_${Math.random()}`, c.airport_update_url || '', 'cache.airport_update_url')}
    `;
  });

  // Query
  html += renderSection('🔍 查询设置', 'query', () => {
    const q = config.query || {};
    const re = q.relay_engines || {};
    return `
      <div class="form-row-3">
        ${renderField('number', '全局超时（秒）', `q_timeout_${Math.random()}`, q.timeout ?? 20, 'query.timeout')}
        ${renderField('number', '提前返回时间（秒）', `q_return_${Math.random()}`, q.return_time ?? 12, 'query.return_time')}
        ${renderField('number', '中继查询超时（秒）', `q_relay_t_${Math.random()}`, q.relay_timeout ?? 8, 'query.relay_timeout')}
      </div>
      <div class="form-row">
        ${renderToggle('航线中继', `q_relay_${Math.random()}`, q.route_relay ?? true, 'query.route_relay')}
        ${renderToggle('过滤已关闭机场', `q_filter_${Math.random()}`, q.filter_inactive_airports ?? true, 'query.filter_inactive_airports')}
      </div>
      ${renderField('text', '优先数据源', `q_suff_${Math.random()}`, q.sufficient_source || '', 'query.sufficient_source')}
      <div style="margin-top:12px;color:var(--muted);font-size:0.85rem;">中继查询引擎</div>
      <div class="form-row" style="margin-top:8px;">
        ${renderToggle('Google Flights', `re_gf_${Math.random()}`, re.google_flights ?? true, 'query.relay_engines.google_flights')}
        ${renderToggle('Skiplagged', `re_sk_${Math.random()}`, re.skiplagged ?? true, 'query.relay_engines.skiplagged')}
      </div>
    `;
  });

  // Output
  html += renderSection('📋 输出设置', 'output', () => {
    const o = config.output || {};
    return `
      <div class="form-row-3">
        ${renderSelect('输出格式', `out_fmt_${Math.random()}`, o.format || 'json', ['table','json'], 'output.format')}
        ${renderSelect('语言', `out_lang_${Math.random()}`, o.language || 'both', ['cn','en','both'], 'output.language')}
        ${renderSelect('货币', `out_cur_${Math.random()}`, o.currency || 'cny', ['cny','usd','original'], 'output.currency')}
      </div>
      ${renderField('number', '汇率（CNY→USD）', `out_rate_${Math.random()}`, o.exchange_rate_cny_usd ?? 7.25, 'output.exchange_rate_cny_usd', '0.01')}
    `;
  });

  container.innerHTML = html;
}

function renderSection(title, id, bodyFn, collapsed = false) {
  const cls = collapsed ? ' collapsed' : '';
  return `
    <div class="section${cls}" id="section-${id}">
      <div class="section-header" onclick="toggleSection('section-${id}')">
        <h3>${title}</h3>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="section-body">${bodyFn()}</div>
    </div>`;
}

function renderSourceCard(key, src, config) {
  const enabled = src.enabled !== false;
  const priority = src.priority ?? 99;
  const cls = enabled ? '' : ' collapsed';
  let bodyHtml = '';

  if (key === 'fr24') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '优先级', `src_${key}_prio`, priority, `sources.${key}.priority`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 10, `sources.${key}.timeout`)}
      </div>`;
  } else if (key === 'google_flights') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '优先级', `src_${key}_prio`, priority, `sources.${key}.priority`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 15, `sources.${key}.timeout`)}
      </div>
      ${renderField('text', 'SerpAPI Key', `src_${key}_serp`, src.serpapi_key || '', `sources.${key}.serpapi_key`)}
      <div class="form-row-3">
        ${renderField('number', '重试次数', `src_${key}_retry`, src.retry ?? 2, `sources.${key}.retry`)}
        ${renderField('number', '重试间隔（秒）', `src_${key}_rd`, src.retry_delay ?? 0.5, `sources.${key}.retry_delay`, '0.1')}
        ${renderField('number', '重试退避倍数', `src_${key}_rb`, src.retry_backoff ?? 2.0, `sources.${key}.retry_backoff`, '0.1')}
      </div>`;
  } else if (key === 'skiplagged') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '优先级', `src_${key}_prio`, priority, `sources.${key}.priority`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 12, `sources.${key}.timeout`)}
      </div>
      <div class="form-row-3">
        ${renderField('number', '重试次数', `src_${key}_retry`, src.retry ?? 4, `sources.${key}.retry`)}
        ${renderField('number', '重试间隔（秒）', `src_${key}_rd`, src.retry_delay ?? 0.5, `sources.${key}.retry_delay`, '0.1')}
        ${renderField('number', '重试退避倍数', `src_${key}_rb`, src.retry_backoff ?? 2.0, `sources.${key}.retry_backoff`, '0.1')}
      </div>
      <div class="form-row">
        ${renderToggle('MCP 后端', `src_${key}_mcp`, src.mcp_enabled ?? false, `sources.${key}.mcp_enabled`)}
        ${renderField('text', 'MCP URL', `src_${key}_mcpurl`, src.mcp_url || '', `sources.${key}.mcp_url`)}
      </div>`;
  } else if (key === 'fliggy_mcp') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '优先级', `src_${key}_prio`, priority, `sources.${key}.priority`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 10, `sources.${key}.timeout`)}
      </div>
      ${renderField('text', 'API Key', `src_${key}_apikey`, src.api_key || '', `sources.${key}.api_key`)}
      ${renderField('text', '签名密钥', `src_${key}_sign`, src.sign_secret || '', `sources.${key}.sign_secret`)}`;
  } else if (key === 'airplanes_live') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '优先级', `src_${key}_prio`, priority, `sources.${key}.priority`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 6, `sources.${key}.timeout`)}
      </div>`;
  } else if (key === 'fast_flights') {
    bodyHtml = `
      <div class="form-row">
        ${renderToggle('启用', `src_${key}_enabled`, enabled, `sources.${key}.enabled`)}
        ${renderField('number', '超时（秒）', `src_${key}_timeout`, src.timeout ?? 15, `sources.${key}.timeout`)}
      </div>`;
  }

  const badge = enabled ? '<span class="status-badge on">开启</span>' : '<span class="status-badge off">关闭</span>';
  return `
    <div class="source-card${cls}" id="source-${key}">
      <div class="source-card-header" onclick="toggleSourceCard('source-${key}')">
        <span class="source-name">${formatSourceName(key)}</span>
        ${badge}
        <span class="source-priority">优先级: ${priority}</span>
        <span class="toggle-icon" style="font-size:0.8rem;">▼</span>
      </div>
      <div class="source-body">${bodyHtml}</div>
    </div>`;
}

function formatSourceName(key) {
  const names = {
    fr24: 'FlightRadar24',
    google_flights: 'Google Flights',
    skiplagged: 'Skiplagged',
    airplanes_live: 'Airplanes.live',
    fliggy_mcp: '飞猪 MCP',
    fast_flights: 'Fast Flights',
  };
  return names[key] || key;
}

function renderField(type, label, id, value, path, step = '1') {
  const stepAttr = step !== '1' ? ` step="${step}"` : '';
  return `
    <div class="form-group">
      <div class="form-label"><strong>${label}</strong><code style="font-size:0.7rem;opacity:0.5;">${path}</code></div>
      <input type="${type}" id="${id}" value="${escapeHtml(String(value))}" data-path="${path}"${stepAttr}>
    </div>`;
}

function renderSelect(label, id, value, options, path) {
  const opts = options.map(o => `<option value="${o}" ${o === value ? 'selected' : ''}>${o}</option>`).join('');
  return `
    <div class="form-group">
      <div class="form-label"><strong>${label}</strong><code style="font-size:0.7rem;opacity:0.5;">${path}</code></div>
      <select id="${id}" data-path="${path}">${opts}</select>
    </div>`;
}

function renderToggle(label, id, value, path) {
  return `
    <div class="form-group">
      <div class="form-label"><strong>${label}</strong><code style="font-size:0.7rem;opacity:0.5;">${path}</code></div>
      <div class="toggle-switch">
        <input type="checkbox" id="${id}" data-path="${path}" ${value ? 'checked' : ''}>
        <label for="${id}"></label>
      </div>
    </div>`;
}

function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setNestedValue(obj, path, value) {
  const keys = path.split('.');
  let current = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!(keys[i] in current)) current[keys[i]] = {};
    current = current[keys[i]];
  }
  current[keys[keys.length - 1]] = value;
}

function collectFormData() {
  if (!currentConfig) return currentConfig;
  const config = JSON.parse(JSON.stringify(currentConfig));
  document.querySelectorAll('[data-path]').forEach(el => {
    const path = el.dataset.path;
    let value;
    if (el.type === 'checkbox') {
      value = el.checked;
    } else if (el.type === 'number') {
      value = parseFloat(el.value) || 0;
    } else if (el.tagName === 'SELECT') {
      value = el.value;
    } else {
      value = el.value;
      if (!isNaN(value) && value !== '' && value !== 'true' && value !== 'false') {
        const num = Number(value);
        if (!isNaN(num)) value = num;
      }
    }
    setNestedValue(config, path, value);
  });
  return config;
}

async function saveConfig() {
  const config = collectFormData();
  if (!config) return showToast('未加载配置', 'error');
  try {
    const resp = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config }),
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      currentConfig = config;
      showToast('配置保存成功！', 'success');
    } else {
      showToast('保存失败: ' + data.message, 'error');
    }
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

async function resetDefaults() {
  if (!confirm('确定要恢复所有设置为默认值吗？此操作不可撤销。')) return;
  try {
    const resp = await fetch('/api/config/defaults');
    const data = await resp.json();
    if (data.status === 'ok') {
      currentConfig = data.defaults;
      renderConfig(data.defaults);
      showToast('已加载默认值。点击"保存配置"生效。', 'success');
    }
  } catch (e) {
    showToast('加载默认值失败', 'error');
  }
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function toggleSourceCard(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function showToast(msg, type) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveConfig();
  }
});

loadConfig();
</script>
</body>
</html>
